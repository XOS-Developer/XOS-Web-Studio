<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XOS Web Studio</title>

<style>
:root{
    --accent:#2d7dff;
    --radius:22px;
    --transition:.25s;

    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#111827;
    --text2:#6b7280;
    --border:#d7dce5;
}

body.dark{
    --bg:#0f1117;
    --panel:#1b1f28;
    --text:#ffffff;
    --text2:#9ca3af;
    --border:#2b3242;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
    height:100vh;
    overflow:hidden;
}

.settings{
    position:absolute;
    top:20px;
    right:25px;
}

.settings select{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 12px;
    font-size:14px;
    cursor:pointer;
}

.container{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:1000px;
    max-width:92%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:28px;
    padding:50px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.header{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:45px;
}

.header img{
    width:90px;
    height:90px;
}

.header h1{
    font-size:42px;
}

.header p{
    margin-top:6px;
    color:var(--text2);
    font-size:18px;
}

.modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.mode{
    background:var(--bg);
    border:2px solid transparent;
    border-radius:22px;
    padding:45px;
    cursor:pointer;
    transition:var(--transition);
    text-align:center;
}

.mode:hover{
    border-color:var(--accent);
    transform:translateY(-6px);
}

.mode .icon{
    font-size:70px;
    margin-bottom:25px;
}

.mode h2{
    font-size:34px;
    margin-bottom:12px;
}

.mode p{
    font-size:17px;
    color:var(--text2);
}

.footer{
    margin-top:35px;
    text-align:center;
    color:var(--text2);
    font-size:15px;
}

@media(max-width:800px){

.modes{
    grid-template-columns:1fr;
}

.box{
    padding:35px;
}

.header{
    flex-direction:column;
    text-align:center;
}

.header h1{
    font-size:34px;
}

}
</style>
</head>

<body>

<div class="settings">
    <select id="themeSelect">
        <option value="system">System</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
    </select>
</div>

<div class="container">

<div class="box">

<div class="header">
    <img src="icons/logo.png" alt="Logo">

    <div>
        <h1>XOS Web Studio</h1>
        <p>Select how you want to start.</p>
    </div>
</div>

<div class="modes">

<div class="mode" onclick="location.href='dev-mode.html'">
    <div class="icon">💻</div>
    <h2>Developer Mode</h2>
    <p>Create websites using code with the development workspace.</p>
</div>

<div class="mode" onclick="location.href='dsg-mode.html'">
    <div class="icon">🎨</div>
    <h2>Designer Mode</h2>
    <p>Design visually with an intuitive drag and drop interface.</p>
</div>

</div>

<div class="footer">
    Choose a workspace to continue.
</div>

</div>

</div>

<script>

const select=document.getElementById("themeSelect");

function applyTheme(theme){

    if(theme==="dark"){
        document.body.classList.add("dark");
    }
    else if(theme==="light"){
        document.body.classList.remove("dark");
    }
    else{

        if(window.matchMedia("(prefers-color-scheme: dark)").matches){
            document.body.classList.add("dark");
        }else{
            document.body.classList.remove("dark");
        }

    }

}

const saved=localStorage.getItem("theme") || "system";

select.value=saved;
applyTheme(saved);

select.onchange=function(){

    localStorage.setItem("theme",this.value);
    applyTheme(this.value);

};

window.matchMedia("(prefers-color-scheme: dark)")
.addEventListener("change",()=>{

    if(localStorage.getItem("theme")==="system"){
        applyTheme("system");
    }

});

</script>

</body>
</html>
